# Lint + unit tests (SPEC 9, item 6). No Odoo and no Gemini in CI: the live Odoo tests
# skip themselves, and Gemini parsing is tested on a recorded synthetic response.
# The review store tests use a Postgres service container.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Review store tests (tests/test_store.py) run against a throwaway Postgres 16.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trimatch
          POSTGRES_PASSWORD: trimatch
          POSTGRES_DB: trimatch_review_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trimatch -d trimatch_review_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRIMATCH_TEST_DB_URL: postgresql+psycopg://trimatch:trimatch@127.0.0.1:5432/trimatch_review_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: OpenAPI document is up to date (frontend types are generated from it)
        run: |
          uv run trimatch openapi ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
