# For writing migrations only: `uv run alembic revision --autogenerate -m "..."` in backend/.
# The URL comes from trimatch.store.db (env / .env), never from this file.
[alembic]
script_location = %(here)s/trimatch/store/migrations
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
