[project]
name = "trimatch"
version = "0.0.1"
description = "Delivery note + invoice three-way match against Odoo, creating draft vendor bills"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trimatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
