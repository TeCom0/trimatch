[project]
name = "trimatch"
version = "0.0.1"
description = "Delivery note + invoice three-way match against Odoo, creating draft vendor bills"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "num2words>=0.5.14",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "playwright>=1.65.1",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.2",
    "python-stdnum>=2.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "typer>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trimatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
trimatch = "trimatch.cli:app"

[tool.pytest.ini_options]
markers = ["odoo: needs the local seeded Odoo (set TRIMATCH_ODOO_TESTS=1)"]
