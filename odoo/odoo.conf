; Template: odoo/entrypoint.sh fills @ADMIN_PASSWD@ and writes the result to $ODOO_RC.
; Database connection comes from PGHOST/PGUSER/PGPASSWORD in docker-compose.yml.
[options]
data_dir = /var/lib/odoo
; all interfaces inside the container; docker-compose.yml publishes it on 127.0.0.1 only
http_interface = 0.0.0.0
admin_passwd = @ADMIN_PASSWD@
db_name = trimatch
dbfilter = ^trimatch$
list_db = False
proxy_mode = False
